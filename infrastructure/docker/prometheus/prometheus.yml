global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cholangiohub-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["cholangiohub-api:8000"]

  - job_name: "cholangiohub-ingestion"
    metrics_path: /metrics
    static_configs:
      - targets: ["cholangiohub-ingestion:8100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
