
services:

  api:
    build:
      context: ../../..
      dockerfile: apps/api/Dockerfile
    container_name: cholangiohub-api
    restart: unless-stopped
    env_file:
      - ../../../.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - cholangiohub

  dashboard:
    build:
      context: ../../..
      dockerfile: apps/dashboard/Dockerfile
    container_name: cholangiohub-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    networks:
      - cholangiohub

  ingestion:
    build:
      context: ../../..
      dockerfile: services/ingestion/Dockerfile
    container_name: cholangiohub-ingestion
    restart: unless-stopped
    env_file:
      - ../../../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: cholangiohub-postgres
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_HOST: cholangiohub-minio
      MINIO_PORT: ${MINIO_PORT}
      MINIO_CONSOLE_PORT: ${MINIO_CONSOLE_PORT}
    ports:
      - "8100:8100"
    networks:
      - cholangiohub

networks:
  cholangiohub:
    driver: bridge
