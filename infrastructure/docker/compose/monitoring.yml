services:

  prometheus:
    image: prom/prometheus:latest
    container_name: cholangiohub-prometheus
    restart: unless-stopped
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - cholangiohub

  grafana:
    image: grafana/grafana:latest
    container_name: cholangiohub-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - cholangiohub

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cholangiohub-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"
    networks:
      - cholangiohub

volumes:
  prometheus_data:
  grafana_data:

networks:
  cholangiohub:
    driver: bridge
