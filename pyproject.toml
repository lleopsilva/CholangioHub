[project]
name = "cholangiohub-workspace"
version = "0.1.0"
description = "Open Data & Knowledge Platform for Cholangiocarcinoma"
requires-python = ">=3.13"

dependencies = []


[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "mypy>=1.17",
    "pre-commit>=4.2",
    "bandit>=1.8",
    "pip-audit>=2.9",
    "testcontainers>=3.8"
]


[tool.uv.workspace]
members = [
    "apps/api",
    "shared",
    "services/ingestion",
    "services/processing"
]

[tool.uv]
package = false

[tool.uv.sources]

cholangiohub-shared = { workspace = true }


[tool.ruff]
line-length = 100
target-version = "py313"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]


[tool.pytest.ini_options]
testpaths = [
    "tests"
]
markers = [
    "integration: tests that require containerized services"
]
pythonpath = [
    "."
]


[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
