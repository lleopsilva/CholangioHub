name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest bandit pip-audit
      - name: Install project packages and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e shared -e services/ingestion -e apps/api httpx2 testcontainers pyspark
      - name: Lint (ruff)
        run: ruff check .
      - name: Typecheck (mypy) - services/ingestion
        run: mypy --ignore-missing-imports services/ingestion
      - name: Typecheck (mypy) - services/processing
        run: mypy --ignore-missing-imports services/processing
      - name: Typecheck (mypy) - apps/api
        run: mypy --ignore-missing-imports apps/api
      # Note: `shared` mypy check omitted due to package layout; run separately if needed
      - name: Run unit tests (pytest)
        run: pytest -q -k "not integration"
      - name: Security scan (bandit)
        run: bandit -r . || true
      - name: Dependency audit (pip-audit)
        run: pip-audit --verbose || true

  integration-tests:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install integration deps
        run: |
          python -m pip install --upgrade pip
          pip install -e shared -e services/ingestion -e apps/api pytest testcontainers psycopg2-binary boto3 botocore requests httpx2 pyspark
      - name: Run integration tests (Postgres container)
        run: |
          # Run all integration tests which require containers
          pytest -q tests/integration
