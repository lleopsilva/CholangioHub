name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest bandit pip-audit
      - name: Install project packages
        run: |
          python -m pip install --upgrade pip
          pip install -e shared -e services/ingestion -e apps/api
      - name: Lint (ruff)
        run: ruff check .
      - name: Typecheck (mypy)
        run: mypy --ignore-missing-imports .
      - name: Run unit tests (pytest)
        run: pytest -q -k "not integration"
      - name: Security scan (bandit)
        run: bandit -r . || true
      - name: Dependency audit (pip-audit)
        run: pip-audit --verbose || true

  integration-tests:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install integration deps
        run: |
          python -m pip install --upgrade pip
          pip install -e shared -e services/ingestion pytest testcontainers psycopg2-binary minio
      - name: Run integration tests
        run: pytest -q tests/services/ingestion/test_pubmed_integration.py
